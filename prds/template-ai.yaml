port: 7890
socks-port: 7891
redir-port: 7892
allow-lan: true
mode: rule
log-level: warning
external-controller: 127.0.0.1:9090
secret: ""
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  use-hosts: true
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - https://dns.google/dns-query
    - https://dns.cloudflare.com/dns-query
  fallback-filter:
    geoip: true
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
  proxy-server-nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - 8.8.4.4
    - 119.29.29.29
    - 223.5.5.5

proxies: []

proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - 🔰 故障转移
  - name: 💬 Ai平台
    type: select
    proxies:
      - 🚀 节点选择
      - 🔰 故障转移
  - name: 🔰 故障转移
    type: fallback
    interval: 185
    url: https://www.gstatic.com/generate_204
    proxies: []
  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
