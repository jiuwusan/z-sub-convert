port: 7890
socks-port: 7891
redir-port: 7892
allow-lan: true
mode: rule
log-level: warning
external-controller: 127.0.0.1:9090
secret: ""
ipv6: false
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  use-hosts: true
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  nameserver:
    - https://cloudflare-dns.com/dns-query#🚀 节点选择
    - https://dns.google/dns-query#🚀 节点选择
  nameserver-policy:
    "geosite:cn":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query

proxies: []

proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - 🔰 故障转移
  - name: 🔰 故障转移
    type: fallback
    interval: 185
    url: https://www.gstatic.com/generate_204
    proxies: []
  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
rules:
  # 直连
  - DOMAIN-KEYWORD,tracker,🎯 全球直连
  - DOMAIN-SUFFIX,lan,🎯 全球直连
  - DOMAIN-SUFFIX,local,🎯 全球直连
  - DOMAIN-SUFFIX,localhost,🎯 全球直连
  - GEOIP,CN,🎯 全球直连
  - MATCH,🚀 节点选择
